<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UF Ticketer - Frontend Tests</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; padding: 24px; background:#f7f7fb; }
        h1 { margin-bottom: 8px; }
        .desc { color:#666; margin-bottom: 20px; }
        .results { margin-top: 16px; }
        .test { padding: 12px 16px; border-radius: 8px; margin-bottom: 10px; border:1px solid #eee; background:#fff; }
        .pass { border-left: 6px solid #22c55e; }
        .fail { border-left: 6px solid #ef4444; }
        .name { font-weight:600; }
        .msg { color:#444; margin-top:4px; }
        .summary { margin-top: 16px; font-weight:600; }
        .muted { color:#6b7280; font-size: 12px; }
    </style>
</head>
<body>
    <h1>UF Ticketer - Frontend Tests</h1>
    <div class="desc">Open this page in your browser to run the tests.</div>

    <!-- Minimal DOM needed by script.js -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo-container"><h1 class="logo">UF Ticketer</h1></div>
            <div class="nav-right">
                <button class="nav-icon-btn" id="friendsBtn"><i class="fas fa-user-friends"></i></button>
                <button class="nav-icon-btn" id="messagesBtn"><i class="fas fa-envelope"></i></button>
                <div class="profile-box" id="profileBtn">
                    <span class="user-name">Sign in</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="hero-section" style="display:none"></div>
    <div class="search-container" style="display:none"></div>
    <div style="display:none">
        <input id="searchInput" />
        <button id="searchBtn"></button>
    </div>

    <div class="offers-section">
        <div class="offers-grid"></div>
    </div>

    <!-- Profile modal elements used by script.js -->
    <div class="modal" id="profileModal" style="display:none">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
        </div>
    </div>

    <div class="results" id="results"></div>
    <div class="summary" id="summary"></div>
    <div class="muted">Note: These are lightweight DOM tests without a test runner.</div>

    <script src="../script.js"></script>
    <script src="tests.js"></script>
</body>
</html>
