<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UF Ticketer - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo-container">
                <h1 class="logo">UF Ticketer</h1>
            </div>
            <div class="nav-right">
                <button class="nav-icon-btn" id="friendsBtn">
                    <i class="fas fa-user-friends"></i>
                </button>
                <button class="nav-icon-btn" id="messagesBtn">
                    <i class="fas fa-envelope"></i>
                </button>
                <div class="profile-box" id="profileBtn">
                    <span class="user-name">Sign in</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="hero-section">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search for events, concerts, sports..." />
                    <button class="search-btn" id="searchBtn">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <section class="offers-section">
            <div class="offers-grid">
                <!-- Offer cards will be generated here -->
            </div>
            <div class="pagination-container">
                <div class="pagination">
                    <button id="prevPageBtn" class="page-arrow" aria-label="Previous page">◀</button>
                    <input id="pageInput" type="number" min="1" value="1" aria-label="Page number" />
                    <button id="nextPageBtn" class="page-arrow" aria-label="Next page">▶</button>
                </div>
                <div class="page-info" id="pageInfo"></div>
            </div>
        </section>
    </main>

    <!-- Login/Signup Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle">Sign In</h2>
            <form id="authForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div class="form-group" id="forgotPasswordGroup">
                    <button type="button" id="forgotPasswordBtn" class="forgot-password-btn">Forgot Password?</button>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">Sign In</button>
                <div class="form-footer">
                    <span id="switchModeText">Don't have an account?</span>
                    <button type="button" id="switchModeBtn" class="switch-mode-btn">Sign Up</button>
                </div>
                <div id="authMessage" class="auth-message"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
